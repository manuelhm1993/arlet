  :root {
    --lila-50:  #faf5ff;
    --lila-100: #f1e6ff;
    --lila-200: #e2ccfb;
    --lila-300: #c9a6f2;
    --lila-500: #9b6bd6;
    --lila-700: #6b3fa8;
    --lila-900: #3f1f6e;
    --rosa:     #e889c4;
    --oro:      #c9a24a;
    --oro-claro:#f3dc94;
    --oro-osc:  #9a7426;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #e9dcfb, #b998e3 70%, #8b62c7);
    display: grid; place-items: center; overflow: hidden;
    font-family: "Cormorant", Georgia, serif; color: var(--lila-900);
    font-variant-numeric: lining-nums;
  }

  /* Lienzo fijo 540×960 (9:16). Se escala con JS al viewport; el PNG se exporta a 2x = 1080×1920. */
  .escenario { width: 540px; height: 960px; transform-origin: center center; flex: none; }
  .tarjeta {
    position: relative; width: 540px; height: 960px; overflow: hidden;
    border-radius: 22px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 30%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #f6eeff 0%, #ead9fd 55%, #d9bdf7 100%);
    box-shadow: 0 30px 80px rgba(63,31,110,.35);
  }

  /* Marco dorado interior */
  .marco {
    position: absolute; inset: 14px; border-radius: 16px; pointer-events: none;
    border: 2px solid var(--oro);
    box-shadow: inset 0 0 0 5px rgba(255,255,255,.6), inset 0 0 0 6px var(--oro-claro);
  }

  .esquina { position: absolute; width: 150px; height: 150px; pointer-events: none; }
  .esquina.si { top: -12px; left: -12px; }
  .esquina.sd { top: -12px; right: -12px; transform: scaleX(-1); }
  .esquina.ii { bottom: -10px; left: -14px; transform: scaleY(-1); width: 120px; height: 120px; }
  .esquina.id { bottom: -10px; right: -14px; transform: scale(-1,-1); width: 120px; height: 120px; }

  .castillo { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 230px; pointer-events: none; opacity: .9; }

  .brillo { position: absolute; color: var(--oro-claro); font-size: 14px; animation: titilar 2.6s ease-in-out infinite; pointer-events: none; text-shadow: 0 0 6px #fff; }
  @keyframes titilar { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  .contenido {
    position: absolute; inset: 0; padding: 40px 40px 0;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .cinta {
    position: relative; margin-top: 4px;
    padding: 7px 34px 8px; color: #fff;
    font-weight: 600; font-style: italic; font-size: 19px; letter-spacing: .2px;
    background: linear-gradient(180deg, var(--lila-500), var(--lila-700));
    border-top: 1.5px solid var(--oro-claro); border-bottom: 1.5px solid var(--oro-claro);
    clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%);
  }

  /* Retrato */
  .retrato { position: relative; margin-top: 44px; width: 214px; height: 262px; }
  .retrato .corona { position: absolute; top: -40px; left: 50%; width: 92px; transform: translateX(-50%) rotate(-4deg); z-index: 3; filter: drop-shadow(0 3px 3px rgba(80,50,10,.35)); }
  .retrato .anillo {
    position: absolute; inset: 0; border-radius: 50%;
    padding: 7px;
    background: conic-gradient(from 200deg, var(--oro-claro), var(--oro), var(--oro-osc), var(--oro-claro), var(--oro), var(--oro-claro));
    box-shadow: 0 10px 26px rgba(63,31,110,.35), 0 0 0 4px rgba(255,255,255,.7);
  }
  .retrato .anillo::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; box-shadow: inset 0 0 0 3px #fff; }
  .retrato img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; border-radius: 50%; }
  .retrato .perla { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #efe4ff 60%, #c7b2e8); box-shadow: 0 1px 2px rgba(0,0,0,.25); z-index: 2; }

  .la-princesa { margin-top: 14px; font-size: 25px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--lila-700); }
  .nombre {
    margin: 0; line-height: .95;
    font-family: "Great Vibes", cursive; font-weight: 400; font-size: 68px;
    background: linear-gradient(180deg, #c45aa6, #7b3fbf);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 #fff);
  }
  .apellidos { margin-top: 2px; font-size: 25px; font-weight: 700; letter-spacing: 1px; color: var(--lila-900); }
  .agrado { margin-top: 8px; font-size: 20px; font-weight: 500; line-height: 1.2; color: var(--lila-900); }

  /* Medallón del 1 */
  .edad { margin-top: 14px; display: flex; align-items: center; justify-content: center; }
  .medallon {
    position: relative; z-index: 2; width: 104px; height: 104px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff8dc, var(--oro-claro) 35%, var(--oro) 70%, var(--oro-osc));
    box-shadow: 0 6px 16px rgba(80,50,10,.35), inset 0 0 0 4px rgba(255,255,255,.55), inset 0 0 0 7px var(--oro-osc);
  }
  .medallon span {
    font-family: "Cormorant", serif; font-weight: 700; font-size: 82px; line-height: 1; margin-top: -8px;
    color: #fff; text-shadow: 0 2px 0 var(--oro-osc), 0 3px 8px rgba(80,50,10,.45);
  }
  .banda {
    margin-left: -26px; padding: 8px 26px 10px 40px; text-align: left;
    background: linear-gradient(180deg, var(--lila-500), var(--lila-700));
    border-top: 1.5px solid var(--oro-claro); border-bottom: 1.5px solid var(--oro-claro);
    clip-path: polygon(0 0, 100% 0, 93% 50%, 100% 100%, 0 100%);
    color: #fff;
  }
  .banda b { display: block; font-size: 34px; font-weight: 700; line-height: .95; }
  .banda i { display: block; font-family: "Great Vibes", cursive; font-style: normal; font-size: 27px; line-height: 1; color: var(--oro-claro); }

  /* Datos */
  .datos { margin-top: 16px; display: grid; gap: 7px; justify-items: start; }
  .dato { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 700; color: var(--lila-900); }
  .dato svg { width: 30px; height: 30px; flex: none; }
  .dato small { font-weight: 500; }

  .pie {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: 330px; padding: 10px 18px 12px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(107,63,168,.94), rgba(63,31,110,.96));
    border: 1.5px solid var(--oro-claro);
    color: #fff; text-align: center; box-shadow: 0 8px 20px rgba(63,31,110,.35);
  }
  .pie b { display: block; font-family: "Great Vibes", cursive; font-weight: 400; font-size: 30px; line-height: 1; color: var(--oro-claro); }
  .pie span { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; font-style: italic; line-height: 1.15; }

  @media (prefers-reduced-motion: reduce) { .brillo { animation: none; opacity: .8; } }
</style>
</head>

<script>
  // Escala el lienzo 540×960 al viewport sin deformarlo (?export desactiva el escalado para la captura PNG).
  (() => {
    const escenario = document.getElementById("escenario");
    if (new URLSearchParams(location.search).has("export")) return;
    const ajustar = () => {
      const margen = 24;
      const s = Math.min((innerWidth - margen) / 540, (innerHeight - margen) / 960);
      escenario.style.transform = `scale(${s})`;
    };
    addEventListener("resize", ajustar);
    ajustar();
  })();
</script>
