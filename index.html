<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arlet · 1 añito de reinado</title>
<meta name="description" content="Invitación al primer cumpleaños de la princesa Arlet — 15 de noviembre de 2026.">
<style>
  @font-face { font-family: "Great Vibes"; src: url("assets/fonts/great-vibes-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-600i.woff2") format("woff2"); font-weight: 600; font-style: italic; font-display: block; }

  :root {
    --lila-50:  #faf5ff;
    --lila-100: #f1e6ff;
    --lila-200: #e2ccfb;
    --lila-300: #c9a6f2;
    --lila-500: #9b6bd6;
    --lila-700: #6b3fa8;
    --lila-900: #3f1f6e;
    --rosa:     #e889c4;
    --oro:      #c9a24a;
    --oro-claro:#f3dc94;
    --oro-osc:  #9a7426;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #e9dcfb, #b998e3 70%, #8b62c7);
    display: grid; place-items: center; overflow: hidden;
    font-family: "Cormorant", Georgia, serif; color: var(--lila-900);
    font-variant-numeric: lining-nums;
  }

  /* Lienzo fijo 540×960 (9:16). Se escala con JS al viewport; el PNG se exporta a 2x = 1080×1920. */
  .escenario { width: 540px; height: 960px; transform-origin: center center; flex: none; }
  .tarjeta {
    position: relative; width: 540px; height: 960px; overflow: hidden;
    border-radius: 22px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 30%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #f6eeff 0%, #ead9fd 55%, #d9bdf7 100%);
    box-shadow: 0 30px 80px rgba(63,31,110,.35);
  }

  /* Marco dorado interior */
  .marco {
    position: absolute; inset: 14px; border-radius: 16px; pointer-events: none;
    border: 2px solid var(--oro);
    box-shadow: inset 0 0 0 5px rgba(255,255,255,.6), inset 0 0 0 6px var(--oro-claro);
  }

  .esquina { position: absolute; width: 150px; height: 150px; pointer-events: none; }
  .esquina.si { top: -12px; left: -12px; }
  .esquina.sd { top: -12px; right: -12px; transform: scaleX(-1); }
  .esquina.ii { bottom: -10px; left: -14px; transform: scaleY(-1); width: 120px; height: 120px; }
  .esquina.id { bottom: -10px; right: -14px; transform: scale(-1,-1); width: 120px; height: 120px; }

  .castillo { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 230px; pointer-events: none; opacity: .9; }

  .brillo { position: absolute; color: var(--oro-claro); font-size: 14px; animation: titilar 2.6s ease-in-out infinite; pointer-events: none; text-shadow: 0 0 6px #fff; }
  @keyframes titilar { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  .contenido {
    position: absolute; inset: 0; padding: 40px 40px 0;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .cinta {
    position: relative; margin-top: 4px;
    padding: 7px 34px 8px; color: #fff;
    font-weight: 600; font-style: italic; font-size: 19px; letter-spacing: .2px;
    background: linear-gradient(180deg, var(--lila-500), var(--lila-700));
    border-top: 1.5px solid var(--oro-claro); border-bottom: 1.5px solid var(--oro-claro);
    clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%);
  }

  /* Retrato */
  .retrato { position: relative; margin-top: 44px; width: 214px; height: 262px; }
  .retrato .corona { position: absolute; top: -40px; left: 50%; width: 92px; transform: translateX(-50%) rotate(-4deg); z-index: 3; filter: drop-shadow(0 3px 3px rgba(80,50,10,.35)); }
  .retrato .anillo {
    position: absolute; inset: 0; border-radius: 50%;
    padding: 7px;
    background: conic-gradient(from 200deg, var(--oro-claro), var(--oro), var(--oro-osc), var(--oro-claro), var(--oro), var(--oro-claro));
    box-shadow: 0 10px 26px rgba(63,31,110,.35), 0 0 0 4px rgba(255,255,255,.7);
  }
  .retrato .anillo::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; box-shadow: inset 0 0 0 3px #fff; }
  .retrato img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; border-radius: 50%; }
  .retrato .perla { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #efe4ff 60%, #c7b2e8); box-shadow: 0 1px 2px rgba(0,0,0,.25); z-index: 2; }

  .la-princesa { margin-top: 14px; font-size: 25px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--lila-700); }
  .nombre {
    margin: 0; line-height: .95;
    font-family: "Great Vibes", cursive; font-weight: 400; font-size: 68px;
    background: linear-gradient(180deg, #c45aa6, #7b3fbf);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 #fff);
  }
  .apellidos { margin-top: 2px; font-size: 25px; font-weight: 700; letter-spacing: 1px; color: var(--lila-900); }
  .agrado { margin-top: 8px; font-size: 20px; font-weight: 500; line-height: 1.2; color: var(--lila-900); }

  /* Medallón del 1 */
  .edad { margin-top: 14px; display: flex; align-items: center; justify-content: center; }
  .medallon {
    position: relative; z-index: 2; width: 104px; height: 104px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff8dc, var(--oro-claro) 35%, var(--oro) 70%, var(--oro-osc));
    box-shadow: 0 6px 16px rgba(80,50,10,.35), inset 0 0 0 4px rgba(255,255,255,.55), inset 0 0 0 7px var(--oro-osc);
  }
  .medallon span {
    font-family: "Cormorant", serif; font-weight: 700; font-size: 82px; line-height: 1; margin-top: -8px;
    color: #fff; text-shadow: 0 2px 0 var(--oro-osc), 0 3px 8px rgba(80,50,10,.45);
  }
  .banda {
    margin-left: -26px; padding: 8px 26px 10px 40px; text-align: left;
    background: linear-gradient(180deg, var(--lila-500), var(--lila-700));
    border-top: 1.5px solid var(--oro-claro); border-bottom: 1.5px solid var(--oro-claro);
    clip-path: polygon(0 0, 100% 0, 93% 50%, 100% 100%, 0 100%);
    color: #fff;
  }
  .banda b { display: block; font-size: 34px; font-weight: 700; line-height: .95; }
  .banda i { display: block; font-family: "Great Vibes", cursive; font-style: normal; font-size: 27px; line-height: 1; color: var(--oro-claro); }

  /* Datos */
  .datos { margin-top: 16px; display: grid; gap: 7px; justify-items: start; }
  .dato { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 700; color: var(--lila-900); }
  .dato svg { width: 30px; height: 30px; flex: none; }
  .dato small { font-weight: 500; }

  .caricatura { position: absolute; left: 16px; top: 686px; width: 124px; pointer-events: none; z-index: 2;
    filter: drop-shadow(0 6px 8px rgba(63,31,110,.25)); }
  .pie {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: 330px; padding: 10px 18px 12px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(107,63,168,.94), rgba(63,31,110,.96));
    border: 1.5px solid var(--oro-claro);
    color: #fff; text-align: center; box-shadow: 0 8px 20px rgba(63,31,110,.35);
  }
  .pie b { display: block; font-family: "Great Vibes", cursive; font-weight: 400; font-size: 30px; line-height: 1; color: var(--oro-claro); }
  .pie span { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; font-style: italic; line-height: 1.15; }

  @media (prefers-reduced-motion: reduce) { .brillo { animation: none; opacity: .8; } }
</style>
</head>
<body>
<main class="escenario" id="escenario">
  <article class="tarjeta" id="tarjeta" aria-label="Invitación al primer cumpleaños de Arlet">

    <!-- Fondo: castillo genérico en silueta -->
    <svg class="castillo" viewBox="0 0 540 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="gCast" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cbb0f0"/><stop offset="1" stop-color="#a682dd"/>
        </linearGradient>
        <linearGradient id="gCast2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e1cdfa"/><stop offset="1" stop-color="#c5a6ef"/>
        </linearGradient>
      </defs>
      <!-- torres traseras -->
      <g fill="url(#gCast2)">
        <rect x="18" y="120" width="34" height="110"/><polygon points="12,122 35,62 58,122"/>
        <rect x="488" y="112" width="34" height="118"/><polygon points="482,114 505,52 528,114"/>
        <rect x="70" y="150" width="28" height="80"/><polygon points="65,152 84,104 103,152"/>
        <rect x="442" y="146" width="28" height="84"/><polygon points="437,148 456,98 475,148"/>
      </g>
      <!-- colinas -->
      <path d="M0 200 Q 120 168 270 192 T 540 186 V230 H0Z" fill="url(#gCast)" opacity=".75"/>
      <path d="M0 214 Q 160 196 300 212 T 540 206 V230 H0Z" fill="#9c74d6" opacity=".55"/>
      <!-- banderines -->
      <g stroke="#c9a24a" stroke-width="1.2">
        <line x1="35" y1="62" x2="35" y2="44"/><line x1="505" y1="52" x2="505" y2="34"/>
      </g>
      <polygon points="35,44 48,48 35,52" fill="#e889c4"/><polygon points="505,34 518,38 505,42" fill="#e889c4"/>
      <!-- ventanas -->
      <g fill="#fff6d6" opacity=".9">
        <rect x="30" y="150" width="9" height="15" rx="4.5"/><rect x="500" y="140" width="9" height="15" rx="4.5"/>
        <rect x="80" y="172" width="8" height="13" rx="4"/><rect x="452" y="168" width="8" height="13" rx="4"/>
      </g>
    </svg>

    <!-- Esquinas florales (originales) -->
    <svg class="esquina si" viewBox="0 0 150 150" aria-hidden="true"><use href="#flores"/></svg>
    <svg class="esquina sd" viewBox="0 0 150 150" aria-hidden="true"><use href="#flores"/></svg>
    <svg class="esquina ii" viewBox="0 0 150 150" aria-hidden="true"><use href="#flores"/></svg>
    <svg class="esquina id" viewBox="0 0 150 150" aria-hidden="true"><use href="#flores"/></svg>

    <div class="marco"></div>

    <span class="brillo" style="top:118px;left:70px">✦</span>
    <span class="brillo" style="top:180px;right:74px;animation-delay:.8s">✦</span>
    <span class="brillo" style="top:330px;left:96px;animation-delay:1.4s;font-size:10px">✦</span>
    <span class="brillo" style="top:300px;right:104px;animation-delay:2s;font-size:11px">✦</span>
    <span class="brillo" style="top:612px;left:58px;animation-delay:.4s">✦</span>
    <span class="brillo" style="top:580px;right:60px;animation-delay:1.7s;font-size:11px">✦</span>

    <div class="contenido">
      <div class="cinta">¡Estás invitado/a a una celebración real!</div>

      <div class="retrato">
        <svg class="corona" viewBox="0 0 100 64" aria-hidden="true">
          <defs>
            <linearGradient id="gOro" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff2bf"/><stop offset=".45" stop-color="#e2bf62"/><stop offset="1" stop-color="#9a7426"/>
            </linearGradient>
          </defs>
          <path d="M8 52 L4 18 L26 36 L38 8 L50 30 L62 8 L74 36 L96 18 L92 52 Z" fill="url(#gOro)" stroke="#8a6620" stroke-width="1.5" stroke-linejoin="round"/>
          <rect x="7" y="50" width="86" height="10" rx="3" fill="url(#gOro)" stroke="#8a6620" stroke-width="1.5"/>
          <circle cx="4" cy="17" r="4" fill="#fff" stroke="#8a6620"/><circle cx="96" cy="17" r="4" fill="#fff" stroke="#8a6620"/>
          <circle cx="38" cy="7" r="4" fill="#fff" stroke="#8a6620"/><circle cx="62" cy="7" r="4" fill="#fff" stroke="#8a6620"/>
          <ellipse cx="50" cy="40" rx="6" ry="7" fill="#b06ad8" stroke="#8a6620"/>
          <circle cx="28" cy="45" r="3.5" fill="#e889c4"/><circle cx="72" cy="45" r="3.5" fill="#e889c4"/>
          <circle cx="20" cy="55" r="2" fill="#fff"/><circle cx="35" cy="55" r="2" fill="#fff"/><circle cx="50" cy="55" r="2" fill="#fff"/><circle cx="65" cy="55" r="2" fill="#fff"/><circle cx="80" cy="55" r="2" fill="#fff"/>
        </svg>
        <div class="anillo"><img src="assets/arlet.jpg" alt="Arlet sonriendo en un jardín de flores"></div>
        <span class="perla" style="left:-4px;top:122px"></span>
        <span class="perla" style="right:-4px;top:122px"></span>
        <span class="perla" style="left:50%;bottom:-5px;transform:translateX(-50%)"></span>
      </div>

      <div class="la-princesa">La princesa</div>
      <h1 class="nombre">Arlet Sofia</h1>
      <div class="apellidos">López Henriquez</div>
      <p class="agrado" style="margin-bottom:0">tiene el agrado de invitarte<br>a celebrar su</p>

      <div class="edad">
        <div class="medallon"><span>1</span></div>
        <div class="banda"><b>añito</b><i>de reinado</i></div>
      </div>

      <div class="datos">
        <div class="dato">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="24" height="21" rx="4" fill="#9b6bd6"/><rect x="4" y="7" width="24" height="7" rx="3" fill="#6b3fa8"/><rect x="9" y="3" width="3" height="8" rx="1.5" fill="#c9a24a"/><rect x="20" y="3" width="3" height="8" rx="1.5" fill="#c9a24a"/><g fill="#fff"><rect x="8" y="17" width="4" height="3" rx="1"/><rect x="14" y="17" width="4" height="3" rx="1"/><rect x="20" y="17" width="4" height="3" rx="1"/><rect x="8" y="22" width="4" height="3" rx="1"/><rect x="14" y="22" width="4" height="3" rx="1" fill="#f3dc94"/></g></svg>
          <span>15 de noviembre de 2026</span>
        </div>
        <div class="dato">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#9b6bd6"/><circle cx="16" cy="16" r="10" fill="#fff"/><path d="M16 9v7l5 3" stroke="#6b3fa8" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="16" cy="16" r="1.8" fill="#c9a24a"/></svg>
          <span>12:00 del día</span>
        </div>
        <div class="dato">
          <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#9b6bd6"><rect x="5" y="14" width="6" height="15"/><rect x="21" y="14" width="6" height="15"/><rect x="10" y="17" width="12" height="12"/></g><g fill="#6b3fa8"><polygon points="4,15 8,5 12,15"/><polygon points="20,15 24,5 28,15"/><polygon points="10,18 16,9 22,18"/></g><path d="M14 29v-5a2 2 0 0 1 4 0v5z" fill="#f3dc94"/></svg>
          <span><small>En el</small> reino de mis padres</span>
        </div>
      </div>
    </div>

    <img class="caricatura" src="assets/arlet-princesa.svg" alt="">

    <div class="pie">
      <b>No faltes</b>
      <span>tu presencia dará realce en mi castillo ♥</span>
    </div>

    <!-- Símbolo floral reutilizable -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <radialGradient id="gPet" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#f6ecff"/><stop offset="1" stop-color="#b78ae6"/></radialGradient>
        <radialGradient id="gPet2" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffe7f5"/><stop offset="1" stop-color="#e889c4"/></radialGradient>
        <g id="flor"><g>
          <ellipse cx="0" cy="-13" rx="9" ry="14"/><ellipse cx="0" cy="-13" rx="9" ry="14" transform="rotate(72)"/>
          <ellipse cx="0" cy="-13" rx="9" ry="14" transform="rotate(144)"/><ellipse cx="0" cy="-13" rx="9" ry="14" transform="rotate(216)"/>
          <ellipse cx="0" cy="-13" rx="9" ry="14" transform="rotate(288)"/></g>
          <circle r="6" fill="#f3dc94" stroke="#c9a24a" stroke-width="1.2"/></g>
        <g id="flores">
          <path d="M10 140 C 30 90, 70 50, 140 20" stroke="#8fae7a" stroke-width="3" fill="none"/>
          <ellipse cx="62" cy="78" rx="12" ry="5" fill="#9fc08a" transform="rotate(-40 62 78)"/>
          <ellipse cx="96" cy="44" rx="11" ry="4.5" fill="#9fc08a" transform="rotate(-25 96 44)"/>
          <use href="#flor" fill="url(#gPet)" transform="translate(40 40) scale(1.5)"/>
          <use href="#flor" fill="url(#gPet2)" transform="translate(92 22) scale(.9)"/>
          <use href="#flor" fill="url(#gPet)" transform="translate(20 100) scale(.85)"/>
          <circle cx="78" cy="72" r="4" fill="#fff" stroke="#c9a24a"/><circle cx="118" cy="48" r="3" fill="#fff" stroke="#c9a24a"/>
        </g>
      </defs>
    </svg>
  </article>
</main>

<script>
  // Escala el lienzo 540×960 al viewport sin deformarlo (?export desactiva el escalado para la captura PNG).
  (() => {
    const escenario = document.getElementById("escenario");
    if (new URLSearchParams(location.search).has("export")) return;
    const ajustar = () => {
      const margen = 24;
      const s = Math.min((innerWidth - margen) / 540, (innerHeight - margen) / 960);
      escenario.style.transform = `scale(${s})`;
    };
    addEventListener("resize", ajustar);
    ajustar();
  })();
</script>
</body>
</html>
